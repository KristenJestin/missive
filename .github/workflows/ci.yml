name: ci

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The first push of a branch has no `before` (forty zeros): every commit it holds is checked.
      # Not on `main`, nor on a pull request into it (the release, `dev` merged by a merge commit):
      # it brings commits already judged as pull requests, and GitHub squashed them with ` (#n)`
      # added to the subject, so one of them is past 72 characters for good.
      - name: Check the Angular commit convention
        if: github.base_ref != 'main' && github.ref != 'refs/heads/main'
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "${base//0/}" ]; then
            tools/commit-message.sh --range "$head"
          else
            tools/commit-message.sh --range "$base..$head"
          fi
      # A pull request is squashed: its title becomes the commit subject.
      - name: Check the title of the pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          tools/commit-message.sh "$RUNNER_TEMP/title"

  # No mail server and no session bus here: the suites run against fakes (see AGENTS.md, Testing).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      # The window's dependencies (GPUI) doubled the time of this job: they are compiled once and
      # restored from the cache after that.
      - uses: Swatinem/rust-cache@v2
      # The keyring tests start their own private bus (see `missive_core::fake::FakeKeyring`).
      - name: Have dbus-daemon
        run: command -v dbus-daemon || { sudo apt-get update && sudo apt-get install -y dbus-daemon; }
      # The window (crates/missive-window) links against the fonts and the keyboard maps; GPUI
      # loads Wayland and Vulkan at run time and opens no window here: its tests use GPUI's own
      # test platform.
      - name: Have the window's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
