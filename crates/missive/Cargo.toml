[package]
name = "missive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A mail client for Linux: background daemon, command line, event stream, and a window"

[dependencies]
async-imap.workspace = true
clap.workspace = true
missive-core.workspace = true
rpassword.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
# The login's encodings, which the logs must not show either.
base64.workspace = true
mail-parser.workspace = true
missive-core = { workspace = true, features = ["fake"] }
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
zbus.workspace = true
