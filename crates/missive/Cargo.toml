[package]
name = "missive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A mail client for Linux: background daemon, command line, event stream, and a window"

[dependencies]
clap.workspace = true
missive-core.workspace = true
rpassword.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[dev-dependencies]
missive-core = { workspace = true, features = ["fake"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }
