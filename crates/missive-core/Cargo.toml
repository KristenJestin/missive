[package]
name = "missive-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What Missive's programs share: IMAP, SMTP, parsing, local copy, search, keyring, socket protocol"

[features]
# A fake IMAP and SMTP server on localhost, and a fake Secret Service on a private bus, for tests
# only (see `fake`).
fake = ["dep:rcgen"]

[dependencies]
async-imap.workspace = true
base64.workspace = true
futures-util.workspace = true
mail-parser.workspace = true
rcgen = { workspace = true, optional = true }
rustls.workspace = true
rustls-native-certs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
toml.workspace = true
zbus.workspace = true

[dev-dependencies]
# The crate's own tests run against its fakes.
missive-core = { path = ".", features = ["fake"] }
tempfile.workspace = true
zbus.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
