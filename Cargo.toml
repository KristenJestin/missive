[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

# One async runtime for the whole workspace: tokio. TLS is rustls on ring, so the build needs no
# C toolchain for a crypto library.
[workspace.dependencies]
missive-core = { path = "crates/missive-core" }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rpassword = "7"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
# The Secret Service, spoken directly: zbus is pure Rust, no libdbus.
zbus = { version = "5", default-features = false, features = ["tokio"] }
