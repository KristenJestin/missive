[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

# One async runtime for the whole workspace: tokio. TLS is rustls on ring, so the build needs no
# C toolchain for a crypto library.
[workspace.dependencies]
missive-core = { path = "crates/missive-core" }
# Cleans a message's HTML for "view original", by allow-list, on html5ever (the parser of Servo).
ammonia = "4"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-channel = "0.3"
futures-util = "0.3"
# The tokenizer ammonia is built on, to find the stylesheets of a message.
html5ever = "0.40"
# Writes the messages Missive sends. Without its default `gethostname`: the Message-ID names the
# sender's domain, never the machine.
mail-builder = { version = "1", default-features = false }
# Reads messages for the local copy: their envelope, from the raw message kept beside it.
mail-parser = "0.11"
# The media type of an attachment, from its file name: a static table, no lookup at run time.
mime_guess = { version = "2", default-features = false }
# The `data:` URLs a message embeds.
percent-encoding = "2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rpassword = "7"
# The user's own id, without `unsafe`: `missive open` checks who owns its folder.
rustix = { version = "1", default-features = false, features = ["process"] }
# The local copy. Bundled, so that every machine has the same SQLite, with FTS5.
rusqlite = { version = "0.40", features = ["bundled"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.9"
# The Secret Service, spoken directly: zbus is pure Rust, no libdbus.
zbus = { version = "5", default-features = false, features = ["tokio"] }
